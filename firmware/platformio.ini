; PlatformIO Project Configuration File for ESP32-S3-DevKitC-1-N16R8
[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 Memory Configuration (16MB Flash QIO, 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; USB-to-UART Port settings (Flashing, Provisioning & Serial Debugging)
monitor_speed = 115200
upload_speed = 921600

; Dual-USB Port Assignment:
; - ARDUINO_USB_MODE=0: Native USB OTG port operates as USB HID Keyboard (Target PC)
; - ARDUINO_USB_CDC_ON_BOOT=0: Hardware Serial stays on USB-to-UART port (Controller PC)
;   and prevents exposing a serial CDC interface on the Target PC's Native USB OTG port.
build_flags = 
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_TINYUSB_ENABLED=1

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.1
