<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with squircle corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- ESP32-S3 Microcontroller Silhouette outline -->
  <g transform="translate(96, 96)">
    <!-- Circuit Board Base -->
    <rect x="0" y="0" width="320" height="320" rx="36" fill="#182234" stroke="rgba(56, 189, 248, 0.3)" stroke-width="3" filter="url(#shadow)"/>
    
    <!-- Chip Shield (ESP32-S3 module) -->
    <rect x="36" y="36" width="248" height="180" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <text x="160" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#94a3b8" letter-spacing="2">ESP32-S3</text>
    <text x="160" y="104" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="3">USB HID · BLE</text>
    
    <!-- Gold / Amber Pins on edges -->
    <g fill="url(#amberGlow)">
      <rect x="8" y="50" width="16" height="8" rx="2"/>
      <rect x="8" y="75" width="16" height="8" rx="2"/>
      <rect x="8" y="100" width="16" height="8" rx="2"/>
      <rect x="8" y="125" width="16" height="8" rx="2"/>
      <rect x="8" y="150" width="16" height="8" rx="2"/>
      
      <rect x="296" y="50" width="16" height="8" rx="2"/>
      <rect x="296" y="75" width="16" height="8" rx="2"/>
      <rect x="296" y="100" width="16" height="8" rx="2"/>
      <rect x="296" y="125" width="16" height="8" rx="2"/>
      <rect x="296" y="150" width="16" height="8" rx="2"/>
    </g>

    <!-- Keycap / Macro Shortcut Symbol -->
    <g transform="translate(60, 140)">
      <rect x="0" y="0" width="200" height="150" rx="24" fill="url(#accent)" filter="url(#shadow)"/>
      <rect x="4" y="4" width="192" height="70" rx="20" fill="white" fill-opacity="0.15"/>
      
      <!-- Command / Shortcut icon -->
      <path d="M 60 70 A 18 18 0 1 1 85 95 L 85 55 A 18 18 0 1 1 110 80 L 70 80 A 18 18 0 1 1 95 105 L 95 65 A 18 18 0 1 1 120 90" 
            fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(10, -5)"/>
    </g>

    <!-- Wireless waves radiating -->
    <path d="M 230 45 A 25 25 0 0 1 265 80" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 245 35 A 40 40 0 0 1 285 75" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
