name: Build and Release ESP32-S3 Firmware

on:
  push:
    tags:
      - 'v*.*.*'
    paths:
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build Firmware
        working-directory: ./firmware
        run: |
          pio run

      - name: Create Firmware Archive
        run: |
          mkdir -p release-assets
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin release-assets/esp32s3_macro_firmware.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/bootloader.bin release-assets/bootloader.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/partitions.bin release-assets/partitions.bin

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
