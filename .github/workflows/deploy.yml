name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build ESP32-S3 Firmware Binaries
        working-directory: ./firmware
        run: pio run

      - name: Stage Firmware Assets for PWA
        run: |
          mkdir -p public/firmware/v1.2.0
          cp firmware/.pio/build/esp32-s3-devkitc-1/bootloader.bin public/firmware/v1.2.0/bootloader.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/partitions.bin public/firmware/v1.2.0/partitions.bin
          cp firmware/.pio/build/esp32-s3-devkitc-1/firmware.bin public/firmware/v1.2.0/firmware.bin
          node -e '
            const fs = require("fs");
            const dir = "public/firmware/v1.2.0";
            const manifest = {
              latest_version: "1.2.0",
              releases: [{
                version: "1.2.0",
                release_date: new Date().toISOString().split("T")[0],
                target_chip: "ESP32-S3-DevKitC-1-N16R8",
                min_app_version: "1.0.0",
                title: "v1.2.0 — ESP32-S3-DevKitC-1-N16R8 (16MB QIO)",
                notes: ["USB-to-UART flash/provision + Native USB OTG HID Keyboard", "German QWERTZ & US layouts"],
                files: [
                  { name: "bootloader.bin", offset: "0x0", size: fs.statSync(`${dir}/bootloader.bin`).size, url: "firmware/v1.2.0/bootloader.bin" },
                  { name: "partitions.bin", offset: "0x8000", size: fs.statSync(`${dir}/partitions.bin`).size, url: "firmware/v1.2.0/partitions.bin" },
                  { name: "firmware.bin", offset: "0x10000", size: fs.statSync(`${dir}/firmware.bin`).size, url: "firmware/v1.2.0/firmware.bin" }
                ]
              }]
            };
            fs.writeFileSync("public/firmware/manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Commit Compiled Firmware Binaries to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/firmware/v1.2.0/*.bin public/firmware/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(firmware): update compiled ESP32-S3 binaries [skip ci]"
            git pull --rebase || true
            git push
          fi

      - name: Typecheck and Lint
        run: npm run lint

      - name: Build Vite PWA
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
